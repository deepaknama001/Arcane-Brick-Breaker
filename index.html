<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#060817"><title>Arcane Brick Breaker</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="shell"><header><div class="brand"><span>✦</span><b>ARCANE</b><small>BRICK BREAKER</small></div><div class="stats"><div>SCORE <b id="score">0</b></div><div>LEVEL <b id="level">1</b></div><div>LIVES <b id="lives">3</b></div><div>COMBO <b id="combo">×1</b></div></div><button id="pauseBtn">Ⅱ</button></header>
<main><canvas id="game" width="1000" height="1400"></canvas><div id="toast"></div>
<section id="menu" class="overlay show"><div class="panel"><div class="rune">✦</div><h1>ARCANE<br><em>BRICK BREAKER</em></h1><p>Shatter the arcane vault. Chain combos. Bend physics.</p><button id="play" class="primary">ENTER THE VAULT</button><div class="row"><button id="how">HOW TO PLAY</button><button id="settings">SETTINGS</button></div><small>Mouse / touch / ← → • Space launches • P pauses</small></div></section>
<section id="pause" class="overlay"><div class="panel"><h2>TIME FROZEN</h2><button id="resume" class="primary">RESUME</button><button id="restart">RESTART LEVEL</button><button class="settingsOpen">SETTINGS</button></div></section>
<section id="modal" class="overlay"><div class="panel wide"><button id="closeModal" class="x">×</button><div id="modalContent"></div></div></section>
<section id="gameover" class="overlay"><div class="panel"><h2 id="endTitle">VAULT LOST</h2><p id="endText"></p><button id="again" class="primary">PLAY AGAIN</button></div></section>
</main><footer><span id="powerText">NO ACTIVE POWER</span><span>BEST <b id="best">0</b></span></footer></div><script src="game.js"></script></body></html>
